# Deploy: fly launch --no-deploy --copy-config --name <app>
#         fly volumes create mono_data --size 1 --region eze
#         fly secrets set SESSION_SECRET=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... ADMIN_EMAILS=... PUBLIC_URL=https://<app>.fly.dev
#         fly deploy
app = "mono-relay"
primary_region = "eze"

[http_service]
  internal_port = 8080
  force_https = true
  # Live connections and pairings are in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  min_machines_running = 1

[mounts]
  source = "mono_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
