<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mono</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0d0d0f; color: #ededed;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { width: 100%; max-width: 360px; }
  .logo { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 13px; background: linear-gradient(135deg, #3f6212, #65a30d); font-size: 28px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #9a9a9a; }
  input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid #2a2a2d; background: #18181a; color: inherit; padding: 0 12px; font: inherit; margin-bottom: 10px; }
  button { width: 100%; height: 44px; border-radius: 10px; border: 0; background: #ededed; color: #0d0d0f; font: 600 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .error { color: #f87171; min-height: 1.4em; margin-top: 12px; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">🐒</div>
  <h1>Mono</h1>
  <p id="status">Conectando…</p>
  <form id="setup" hidden>
    <input id="relay" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://tu-relay.fly.dev" required />
    <button>Entrar con Google</button>
  </form>
  <div class="error" id="error"></div>
</main>
<script src="app.js"></script>
</body>
</html>
